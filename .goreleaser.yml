version: 2

project_name: vigilo

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: vigilo
    main: cmd/vigilo
    binary: vigilo
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos:
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - >-
        -s -w 
        -X main.version={{.Version}} 
        -X main.commit={{.Commit}} 
        -X main.date={{.Date}}

archives:
  - id: vigilo
    builds:
      - vigilo
    format: tar.gz
    format_overrides:
      - format: zip
        goos: windows
    name_template: >-
      {{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md
      - QUICKSTART.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  use: github
  sort: "asc"
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
      - '^build:'
      - 'Merge pull request'
      - 'Merge branch'

release:
  github:
    owner: rodrigue-nde
    name: vigilo
  draft: false
  prerelease: auto
  name_template: "Vigilo {{ .Version}}"

sboms:
  - artifacts: archive