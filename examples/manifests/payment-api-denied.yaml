apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
  namespace: payments-prod
  labels:
    app.kubernetes.io/name: payment-api
    app.kubernetes.io/part-of: payments-platform
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: payment-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payment-api
    spec:
      containers:
        - name: payment-api
          image: vigilo/payment-api:1.0.0
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: "3"
              memory: "6Gi"
            limits:
              cpu: "4"
              memory: "8Gi"