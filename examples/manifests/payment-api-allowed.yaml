apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
  namespace: payments-prod
  labels:
    app.kubernetes.io/name: payment-api
    app.kubernetes.io/part-of: payments-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: payment-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payment-api
    spec:
      containers:
        - name: api
          image: vigilo/payment-api:1.0.0
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"